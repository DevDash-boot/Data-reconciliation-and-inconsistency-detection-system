plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'Recon - 데이터 대조 및 불일치 탐지 시스템'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-mustache'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'com.mysql:mysql-connector-j'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}

// 커버리지 리포트: build/reports/jacoco/test/html/index.html
jacocoTestReport {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
}

// ./gradlew generateSample -Psize=100000 -PoutDir=data/100k -Pseed=42
tasks.register('generateSample', JavaExec) {
    group = 'recon'
    description = '샘플 데이터 생성 (옵션: -Psize -PmissingA -PmissingB -Pduplicate -PvalueDiff -Pexcluded -Pseed -PoutDir)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.example.recon.generator.SampleDataGeneratorMain'
    def opts = []
    ['size', 'missingA', 'missingB', 'duplicate', 'valueDiff', 'excluded', 'seed', 'outDir'].each { k ->
        if (project.hasProperty(k)) {
            opts << "--${k}=${project.property(k)}".toString()
        }
    }
    args = opts
}

// 컴파일/실행/테스트 모두 UTF-8 로 고정한다. (Windows 터미널에서 한글 로그가 깨지는 문제 방지)
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
tasks.withType(JavaExec).configureEach {      // bootRun, generateSample
    jvmArgs '-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
}
tasks.withType(Test).configureEach {
    jvmArgs '-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
}

// 힙 크기 지정 예: ./gradlew bootRun -Pxmx=512m --args="..."
// (jvmArgs = [...] 로 덮어쓰면 위의 UTF-8 옵션이 사라지므로 추가(append) 방식으로 쓴다)
tasks.named('bootRun') {
    if (project.hasProperty('xmx')) {
        jvmArgs "-Xmx${project.property('xmx')}".toString()
    }
}
