spring:
  application:
    name: recon

  # 프로젝트 루트의 .env 파일을 설정값으로 읽는다. (파일이 없어도 에러 없음)
  config:
    import: optional:file:.env[.properties]

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

  datasource:
    # rewriteBatchedStatements=true : JDBC batch 를 여러 행짜리 INSERT 하나로 묶어 보낸다 (#13)
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:recon}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&rewriteBatchedStatements=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update   # 개발 초기용. ERD 확정 후 validate 로 전환 검토
    properties:
      hibernate:
        format_sql: true

recon:
  jdbc:
    batch-size: 1000     # JDBC batch 한 번에 보내는 행 수 (#13 에서 500/1000/5000 비교)
  chunk:
    partitions: 16       # CHUNKED 모드의 청크 수 (#14 에서 4/16/64 비교)
  engine:
    default-mode: IN_MEMORY   # IN_MEMORY | CHUNKED
  schedule:
    enabled: false            # true 로 바꾸면 주기 대조가 켜진다 (#17)
    cron: "0 0 2 * * *"       # 초 분 시 일 월 요일 : 매일 02:00
    strategy: EXACT
  admin:                      # 시작할 때 ADMIN 계정을 만든다 (둘 다 있을 때만). .env 에 설정 (#21)
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
