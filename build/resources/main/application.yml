spring:
  application:
    name: recon

  # 프로젝트 루트의 .env 파일을 설정값으로 읽는다. (파일이 없어도 에러 없음)
  config:
    import: optional:file:.env[.properties]

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:recon}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update   # 개발 초기용. ERD 확정 후 validate 로 전환 검토
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
